<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfa" />
    <style>
      /* This is intentionally in the document shell rather than the app bundle.
         It paints the persisted canvas before stylesheets and React are ready. */
      html, body, #root { min-height: 100%; margin: 0; background: #f4f8fb; color: #0f172a; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root {
        background: #07111f;
        color: #f3f7fc;
      }
    </style>
    <script>
      (() => {
        const appRoute = /^(?:\/app|\/login|\/register|\/settings)(?:\/|$)/.test(window.location.pathname);
        const appPreview = new URLSearchParams(window.location.search).get('presentation') === '1'
          || new URLSearchParams(window.location.search).get('e2e') === '1';
        if (!appRoute && !appPreview) return;
        try {
          const stored = JSON.parse(window.localStorage.getItem('pwayment-theme') || 'null');
          const mode = stored?.state?.mode === 'dark' ? 'dark' : 'light';
          const root = document.documentElement;
          root.dataset.theme = mode;
          root.classList.add(`theme-${mode}`);
          root.style.colorScheme = mode;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.content = mode === 'dark' ? '#07111f' : '#f4f8fb';
        } catch {
          // A blocked or malformed local preference must never prevent startup.
        }
      })();
    </script>
    <link rel="canonical" href="https://www.pwayment.be/" />
